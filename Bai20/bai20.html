<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 20 — Hiệu ứng ảnh với CSS Filter</title>
    <link rel="stylesheet" href="bai20.css">
</head>
<body>

    <div class="container">
        <!-- Khung ảnh và chữ -->
        <div class="card">
            <img id="rose-img" src="hoahong.gif" alt="Hoa hồng" class="filter-gray">
            <div class="subtitle">Special For You</div>
        </div>

        <!-- Thanh các nút bấm -->
        <div class="button-group">
            <button class="btn active">Gray</button>
            <button class="btn">Xray</button>
            <button class="btn">Invert</button>
            <button class="btn">FlipH</button>
            <button class="btn">FlipV</button>
            <button class="btn">Glow</button>
            <button class="btn">Shadow</button>
            <button class="btn">Bold Shadow</button>
            <button class="btn">DropShadow</button>
            <button class="btn">Blur</button>
            <button class="btn">Wave</button>
            <button class="btn">Mask</button>
            <button class="btn">Alpha</button>
        </div>
    </div>

    <script src="bai20.js"></script>
</body>
</html>
