<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 — Form đăng ký với Bootstrap</title>
    <!-- Thêm Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Card chứa form -->
                <div class="card shadow-sm border-0">
                    <!-- Header card nền xanh bg-success, chữ trắng, căn giữa -->
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
                    </div>

                    <!-- Body card chứa form -->
                    <div class="card-body p-4">
                        <form action="#" method="POST">
                            <div class="row g-3">
                                <!-- Họ và tên -->
                                <div class="col-12 col-md-6">
                                    <label for="fullname" class="form-label">Họ và tên</label>
                                    <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                                </div>

                                <!-- Mã sinh viên -->
                                <div class="col-12 col-md-6">
                                    <label for="studentId" class="form-label">Mã sinh viên</label>
                                    <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                                </div>

                                <!-- Email -->
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label">Số điện thoại</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                                </div>

                                <!-- Trình độ (Radio buttons) -->
                                <div class="col-12">
                                    <label class="form-label d-block">Trình độ</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="level" id="levelBasic" value="Co ban" checked required>
                                        <label class="form-check-label" for="levelBasic">Cơ bản</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="level" id="levelFair" value="Kha">
                                        <label class="form-check-label" for="levelFair">Khá</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="level" id="levelGood" value="Tot">
                                        <label class="form-check-label" for="levelGood">Tốt</label>
                                    </div>
                                </div>

                                <!-- Chọn lớp (Select) -->
                                <div class="col-12">
                                    <label for="classSelect" class="form-label">Chọn lớp</label>
                                    <select class="form-select" id="classSelect" required>
                                        <option value="67CNTT1" selected>67CNTT1</option>
                                        <option value="67CNTT2">67CNTT2</option>
                                        <option value="67CNTT3">67CNTT3</option>
                                    </select>
                                </div>

                                <!-- Checkbox Cam kết -->
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="commitment" checked required>
                                        <label class="form-check-label" for="commitment">
                                            Tôi cam kết tự làm bài và quay video OBS
                                        </label>
                                    </div>
                                </div>

                                <!-- Các nút bấm -->
                                <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                    <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                                    <button type="submit" class="btn btn-success">Đăng ký</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
