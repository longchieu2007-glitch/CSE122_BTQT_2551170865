<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In Lịch</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>

<div class="container">
    <!-- Ô hiển thị lịch -->
    <div class="calendar-box">
        <div class="year red-text" id="displayYear">2026</div>
        <div class="month blue-text" id="displayMonth">Tháng 12</div>
        <div class="day-number red-text" id="displayDay">24</div>
        <div class="day-name blue-text" id="displayDayOfWeek">Thứ hai</div>
    </div>

    <!-- Lời chào theo buổi -->
    <div class="greeting" id="displayGreeting">Chào buổi sáng!</div>

    <!-- Form nhập liệu -->
    <div class="input-form">
        <div class="input-group">
            <label for="inputDay">Ngày</label>
            <input type="number" id="inputDay" value="24" min="1" max="31">
        </div>
        <div class="input-group">
            <label for="inputMonth">Tháng</label>
            <input type="number" id="inputMonth" value="12" min="1" max="12">
        </div>
        <div class="input-group">
            <label for="inputYear">Năm</label>
            <input type="number" id="inputYear" value="2026">
        </div>
        <button type="button" class="btn-print" id="btnPrint">In lịch</button>
    </div>
</div>

<script src="bai12.js"></script>
</body>
</html>
