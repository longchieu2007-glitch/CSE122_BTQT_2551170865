<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 23 - Thư viện ảnh hiệu ứng Hover</title>
    <link rel="stylesheet" href="bai23.css">
</head>
<body>

    <div class="wrapper">
        <!-- Tiêu đề -->
        <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
        <p class="subtitle">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        
        <div class="gallery">
            
            <div class="box">
                <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <div class="overlay">
                    <span>Vịnh Hạ Long</span>
                </div>
            </div>

            <div class="box">
                <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <div class="overlay">
                    <span>Hang Sơn Đoòng</span>
                </div>
            </div>

            <div class="box">
                <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <div class="overlay">
                    <span>Thác Bản Giốc</span>
                </div>
            </div>

            <div class="box">
                <img src="4-fansipan.jpg" alt="Fansipan">
                <div class="overlay">
                    <span>Fansipan</span>
                </div>
            </div>

            <div class="box">
                <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">
                    <span>Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <div class="box">
                <img src="6-phong-nha.jpg" alt="Động Phong Nha">
                <div class="overlay">
                    <span>Động Phong Nha</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
