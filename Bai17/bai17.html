<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 17 — Kiểm tra biểu mẫu bằng JavaScript</title>
  <link rel="stylesheet" href="bai17.css">
</head>
<body>

  <div class="card">
    <h2>Đăng ký tài khoản</h2>
    <p class="subtitle">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>

    <form id="registerForm" novalidate>
      <!-- Họ và tên -->
      <div class="form-group">
        <label for="fullname">Họ và tên</label>
        <input type="text" id="fullname" placeholder="">
        <div class="message" id="fullnameMsg"></div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="">
        <div class="message" id="emailMsg"></div>
      </div>

      <!-- Mật khẩu -->
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="">
        <div class="message" id="passwordMsg"></div>
      </div>

      <!-- Xác nhận mật khẩu -->
      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" placeholder="">
        <div class="message" id="confirmPasswordMsg"></div>
      </div>

      <!-- Nút Đăng ký -->
      <button type="submit" class="btn-submit">Đăng ký</button>
    </form>
  </div>

  <script src="bai17.js"></script>
</body>
</html>
