<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 13 - Đồng hồ số và Lời chào</title>
    <link rel="stylesheet" href="bai13.css">
</head>
<body>
    <div class="container">
        <!-- Đồng hồ số hiển thị dạng ảnh -->
        <div id="clock" class="clock">
            <img id="h1" src="00.gif" alt="h1">
            <img id="h2" src="01.gif" alt="h2">
            <img src="haicham.gif" alt="colon">
            <img id="m1" src="01.gif" alt="m1">
            <img id="m2" src="02.gif" alt="m2">
            <img src="haicham.gif" alt="colon">
            <img id="s1" src="01.gif" alt="s1">
            <img id="s2" src="02.gif" alt="s2">
        </div>

        <div id="greeting" class="greeting">
            Chào buổi sáng
        </div>
    </div>

    <script src="bai13.js"></script>
</body>
</html>
